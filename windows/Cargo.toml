[package]
name = "urdr"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11"] }
cpal = "0.15"
hound = "3.5"
signalsmith-stretch = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native dialogs are only needed on Windows; the Linux build exists for tests and opens songs from the command line.
[target.'cfg(windows)'.dependencies]
rfd = "0.15"

[profile.release]
opt-level = 3
strip = true

# The stretcher's C++ runs in the audio callback, so keep it optimised in test builds too.
[profile.dev.package.signalsmith-stretch]
opt-level = 3
